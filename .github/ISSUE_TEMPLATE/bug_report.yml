name: Bug report
description: Report a defect in AgentMemoryOS
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - AgentMemoryOS (core)
        - AgentMemoryOS.Postgres
        - AgentMemoryOS.Redis
        - AgentMemoryOS.All
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: .NET SDK version, OS, store/backend in use (in-memory / Postgres / Redis, chat backend).
    validations:
      required: false
