name: Release

# Publishes to NuGet. Two ways in:
#   1. Push a tag manually, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
#   2. Called by tag-on-version-bump.yml after a VersionPrefix change merges to main.
on:
  push:
    tags: [ 'v*' ]
  workflow_call:
    inputs:
      version:
        description: Version to pack and publish (no leading v).
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: pack-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derive version
        id: ver
        # workflow_call supplies inputs.version; a tag push derives it from the ref.
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack AgentMemoryOS.slnx -c Release -o artifacts -p:Version=${{ steps.ver.outputs.version }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
